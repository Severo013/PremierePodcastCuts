<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Premiere Podcast Cuts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="panel">
      <h1>Premiere Podcast Cuts</h1>
      <p id="status" role="status" aria-live="polite">
        Selecione um JSON e um vídeo MP4.
      </p>
      <p class="phase">Estado: <strong id="phase">idle</strong></p>

      <div class="controls">
        <button id="select-json-button" type="button">Selecionar JSON</button>
        <button id="select-video-button" type="button">Selecionar MP4</button>
        <button id="create-cuts-button" type="button" disabled>
          Criar cortes
        </button>
      </div>

      <section class="selection">
        <h2>Arquivos selecionados</h2>
        <dl>
          <div>
            <dt>JSON</dt>
            <dd id="selected-json-name">Nenhum</dd>
          </div>
          <div>
            <dt>Vídeo</dt>
            <dd id="selected-video-name">Nenhum</dd>
          </div>
        </dl>
      </section>

      <section id="summary" class="summary" hidden>
        <h2>Resumo</h2>
        <dl>
          <div>
            <dt>Arquivo</dt>
            <dd id="json-file-name"></dd>
          </div>
          <div>
            <dt>Projeto</dt>
            <dd id="project-name"></dd>
          </div>
          <div>
            <dt>Cortes</dt>
            <dd id="cuts-count"></dd>
          </div>
        </dl>
        <ol id="cuts-list"></ol>
      </section>

      <section id="errors" class="errors" role="alert" hidden>
        <h2>Erros de validação</h2>
        <ul id="errors-list"></ul>
      </section>

      <section id="log" class="log" aria-live="polite">
        <h2>Log</h2>
        <ol id="log-list"></ol>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
